<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테티스 시스템 | 딜 시뮬레이션</title>
    <meta name="description" content="명조 데미지 시뮬레이터">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwindConfig = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>

    <style>
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <link rel="stylesheet" href="output.css">

  </head>

  <body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
        
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5">
          <div class="relative w-8 h-8 rounded-lg overflow-hidden flex-shrink-0">
            <img alt="테티스" loading="lazy" decoding="async" data-nimg="fill" class="object-cover object-[50%_15%]" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent" src="https://arufuzgxjgjbjlgddrdo.supabase.co/storage/v1/object/public/images/site/logo.png">
          </div>
          <span class="font-bold text-lg hidden sm:inline">
            <span class="text-teal-400">테티스</span>
            <span class="text-zinc-300"> 시스템</span>
          </span>
        </a>

        <!-- Navigation (Desktop) -->
        <nav class="hidden md:flex items-center gap-6 text-sm text-zinc-400">
          <a href="/" class="hover:text-teal-400 transition-colors">캐릭터</a>
          <a href="/party-cycle" class="hover:text-teal-400 transition-colors">파티사이클</a>
          <a href="/party-builder" class="hover:text-teal-400 transition-colors">파티편성</a>
          <a href="/dmg-simulate" class="hover:text-teal-400 transition-colors">딜 시뮬레이션</a>
          <a href="/posts" class="hover:text-teal-400 transition-colors">기타공략</a>
          <a href="/issues" class="hover:text-teal-400 transition-colors">방명록</a>
        </nav>

        <!-- Search & Login (Desktop) -->
        <div class="hidden md:flex items-center gap-2">
          <button class="flex items-center gap-2 text-sm text-zinc-500 hover:text-zinc-300 transition-colors border border-zinc-800 rounded-lg px-3 py-1.5 hover:border-zinc-600">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>검색</span>
            <kbd class="text-xs border border-zinc-700 rounded px-1 py-0.5 text-zinc-600">Ctrl+K</kbd>
          </button>
          <a href="/login" class="text-sm font-medium text-zinc-400 hover:text-zinc-100 transition-colors px-3 py-1.5">
            로그인
          </a>
        </div>

        <!-- Mobile Menu -->
        <div class="flex md:hidden items-center gap-2">
          <button class="p-2 text-zinc-400 hover:text-zinc-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
          <button class="flex flex-col gap-1.5 p-2 text-zinc-400 hover:text-zinc-100">
            <span class="block w-5 h-0.5 bg-current"></span>
            <span class="block w-5 h-0.5 bg-current"></span>
            <span class="block w-5 h-0.5 bg-current"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="space-y-8">
        
        <!-- Title Section -->
        <div class="space-y-2">
          <h1 class="text-3xl font-bold text-zinc-100">
            캐릭터 데미지 시뮬레이션
          </h1>
          <p class="text-zinc-500">
            캐릭터의 육성 정도와 사이클에 따른 데미지 예상치를 보여줍니다.
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center gap-2">
          <div id="currentPartyLabel" class="text-sm font-bold text-zinc-200"></div>

          <div class="flex items-center gap-2">
            <div id="partySaveBar" class="hidden items-center gap-2">
              <input id="partyNameInput" type="text" placeholder="파티 이름..."
                class="bg-transparent border border-teal-500/60 rounded-md px-4 py-1 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-teal-400 w-32">
              <button onclick="confirmPartySave()" class="shrink-0 text-xs font-medium text-teal-300 hover:text-teal-200 border border-teal-500/60 hover:border-teal-400 rounded-md px-2 py-1 transition-colors">
                저장
              </button>
              <button onclick="cancelPartySave()" class="shrink-0 text-zinc-500 hover:text-zinc-300 text-lg leading-none px-1">
                ×
              </button>
            </div>

            <button id="partyUpdateBtn" onclick="updateCurrentParty()" class="hidden text-xs text-teal-400 hover:text-teal-300 border border-teal-500/60 hover:border-teal-400 px-3 py-1 rounded-md transition-colors">
              수정
            </button>
            <button id="partySaveOpenBtn" onclick="openPartySaveBar()" class="text-xs text-zinc-500 hover:text-teal-400 border border-zinc-700 hover:border-teal-500/50 px-3 py-1 rounded-md transition-colors">
              파티 저장
            </button>
            <button onclick="resetCharacterSetup()" class="text-xs text-zinc-500 hover:text-zinc-300 border border-zinc-700 hover:border-zinc-500 px-3 py-1 rounded-md transition-colors">
              초기화
            </button>
          </div>
        </div>

        <!-- 저장된 파티 목록 -->
        <div id="partyListSection" class="hidden">
          <div class="text-xs text-zinc-500 mb-2">저장된 파티</div>
          <div id="partyListPills" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="">
          캐릭터 육성 설정
        </div>

        <!-- 캐릭터 스펙 설정 -->
        <div class="grid grid-cols-3 gap-4">

          <!-- 슬롯 1 -->
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3">
            <div id="spec-slot-1" class="relative w-full aspect-square rounded-lg overflow-hidden">
              <button onclick="openCharacterPicker('spec-slot-1')" class="w-full h-full flex items-center justify-center text-2xl text-zinc-600 hover:text-teal-400 border-2 border-dashed border-zinc-700 hover:border-teal-500 rounded-lg transition-colors">
                ＋
              </button>
            </div>
          </div>

          <!-- 슬롯 2 -->
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3">
            <div id="spec-slot-2" class="relative w-full aspect-square rounded-lg overflow-hidden">
              <button onclick="openCharacterPicker('spec-slot-2')" class="w-full h-full flex items-center justify-center text-2xl text-zinc-600 hover:text-teal-400 border-2 border-dashed border-zinc-700 hover:border-teal-500 rounded-lg transition-colors">
                ＋
              </button>
            </div>
          </div>

          <!-- 슬롯 3 -->
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3">
            <div id="spec-slot-3" class="relative w-full aspect-square rounded-lg overflow-hidden">
              <button onclick="openCharacterPicker('spec-slot-3')" class="w-full h-full flex items-center justify-center text-2xl text-zinc-600 hover:text-teal-400 border-2 border-dashed border-zinc-700 hover:border-teal-500 rounded-lg transition-colors">
                ＋
              </button>
            </div>
          </div>

        </div>

        <!-- 캐릭터별 속성 상세정보 + 버프 토글 (계산 전에도 항상 보이는 '설정' 영역) -->
        <div class="grid grid-cols-3 gap-4">
          <div id="spec-detail-1"></div>
          <div id="spec-detail-2"></div>
          <div id="spec-detail-3"></div>
        </div>

        <!-- 적 설정 (파티 전체 공용 — 방어력/저항 계수에 쓰임) -->
        <div class="flex items-center gap-4 text-xs text-zinc-400">
          <span class="text-zinc-500">적 설정</span>
          <label class="flex items-center gap-1.5">
            레벨
            <input id="enemyLevelInput" type="number" min="1" max="200" oninput="setEnemySetting('level', this.value)"
              class="w-16 bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-zinc-200 text-right focus:outline-none focus:border-teal-500">
          </label>
          <label class="flex items-center gap-1.5">
            속성 저항
            <input id="enemyResInput" type="number" step="1" oninput="setEnemySetting('res', this.value)"
              class="w-16 bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-zinc-200 text-right focus:outline-none focus:border-teal-500">
            %
          </label>
        </div>

        <!-- 계산하기 — 이걸 눌러야 피해/로테이션 결과가 나옴 -->
        <div class="flex flex-col items-center gap-1.5">
          <button id="calcBtn" onclick="runDamageCalculation()"
            class="px-8 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 border border-teal-500 text-sm font-bold text-white transition-colors">
            계산하기
          </button>
          <div id="calcHint" class="text-[11px] text-zinc-500"></div>
        </div>

        <!-- 계산 결과 (로테이션 분석 + 스킬별 피해) — 계산하기를 눌러야 채워짐 -->
        <div class="grid grid-cols-3 gap-4">
          <div id="result-detail-1"></div>
          <div id="result-detail-2"></div>
          <div id="result-detail-3"></div>
        </div>

      </div>
    </main>

    <!-- 캐릭터 선택 모달 -->
    <div id="characterPickerModal" onclick="if(event.target===this) closeCharacterPicker()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-3xl max-h-[80vh] flex flex-col overflow-hidden p-5">

        <!-- 타이틀 -->
        <div class="flex items-center justify-between mb-4">
          <h2 id="pickerTitle" class="text-lg font-bold text-zinc-100">캐릭터 선택</h2>
          <button onclick="closeCharacterPicker()" class="text-zinc-500 hover:text-zinc-300 text-xl leading-none">
            ×
          </button>
        </div>

        <!-- 검색창 -->
        <input id="characterSearchInput" type="text" placeholder="캐릭터 이름 검색..." oninput="filterCharacterList()"
          class="w-full bg-transparent border border-zinc-700 rounded-lg px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 mb-4">

        <!-- 캐릭터 목록 (스크롤) -->
        <div class="overflow-y-auto">
          <div id="characterList" class="grid grid-cols-5 gap-3">
            <!-- 캐릭터 카드는 renderCharacterList()가 characters 배열로 자동 생성함 -->
          </div>
        </div>

      </div>
    </div>

    <!-- 에코 설정 모달 -->
    <div id="echoEditorModal" onclick="if(event.target===this) closeEchoEditor()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden p-5">

        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-zinc-100">에코 설정</h2>
          <button onclick="closeEchoEditor()" class="text-zinc-500 hover:text-zinc-300 text-xl leading-none">
            ×
          </button>
        </div>

        <div id="echoEditorBody" class="space-y-3 overflow-y-auto scrollbar-none">
          <!-- renderEchoEditorModal()이 채움 -->
        </div>

        <div class="flex gap-2 mt-5 shrink-0">
          <button onclick="clearEchoEditor()" class="flex-1 text-sm text-zinc-400 hover:text-zinc-200 border border-zinc-700 hover:border-zinc-500 rounded-lg py-2 transition-colors">
            비우기
          </button>
          <button onclick="saveEchoEditor()" class="flex-1 text-sm text-white bg-teal-600 hover:bg-teal-500 rounded-lg py-2 transition-colors">
            완료
          </button>
        </div>

      </div>
    </div>

    <!-- 속성 상세정보 모달 -->
    <div id="statDetailModal" onclick="if(event.target===this) closeStatDetailModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden p-5">

        <div class="flex items-center justify-between mb-4">
          <h2 id="statDetailTitle" class="text-lg font-bold text-zinc-100">속성 상세정보</h2>
          <button onclick="closeStatDetailModal()" class="text-zinc-500 hover:text-zinc-300 text-xl leading-none">
            ×
          </button>
        </div>

        <div id="statDetailBody" class="overflow-y-auto scrollbar-none">
          <!-- openStatDetailMore()가 채움 -->
        </div>

      </div>
    </div>

    <!-- 파이차트 조각에 마우스를 올렸을 때 뜨는 툴팁 -->
    <div id="damageTooltip" class="hidden fixed z-50 pointer-events-none px-2 py-1 rounded-md bg-zinc-800 border border-zinc-700 text-[11px] text-zinc-100 shadow-lg whitespace-nowrap"></div>

    <!-- 스킬 피해 상세 모달 -->
    <div id="damageDetailModal" onclick="if(event.target===this) closeDamageDetailModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden p-5">

        <div class="flex items-center justify-between mb-4">
          <h2 id="damageDetailTitle" class="text-lg font-bold text-zinc-100">스킬 피해</h2>
          <button onclick="closeDamageDetailModal()" class="text-zinc-500 hover:text-zinc-300 text-xl leading-none">
            ×
          </button>
        </div>

        <div id="damageDetailBody" class="overflow-y-auto scrollbar-none">
          <!-- openDamageDetail()이 채움 -->
        </div>

      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/damage.js"></script>
    <script src="js/main.js"></script>

  </body>
</html>
