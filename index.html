<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테티스 시스템 | 딜 시뮬레이션</title>
    <meta name="description" content="명조 데미지 시뮬레이터">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwindConfig = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>

    <style>
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <link rel="stylesheet" href="output.css">

  </head>

  <body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
        
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2.5">
          <div class="relative w-8 h-8 rounded-lg overflow-hidden flex-shrink-0">
            <img alt="테티스" loading="lazy" decoding="async" data-nimg="fill" class="object-cover object-[50%_15%]" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent" src="https://arufuzgxjgjbjlgddrdo.supabase.co/storage/v1/object/public/images/site/logo.png">
          </div>
          <span class="font-bold text-lg hidden sm:inline">
            <span class="text-teal-400">테티스</span>
            <span class="text-zinc-300"> 시스템</span>
          </span>
        </a>

        <!-- Navigation (Desktop) -->
        <nav class="hidden md:flex items-center gap-6 text-sm text-zinc-400">
          <a href="/" class="hover:text-teal-400 transition-colors">캐릭터</a>
          <a href="/party-cycle" class="hover:text-teal-400 transition-colors">파티사이클</a>
          <a href="/party-builder" class="hover:text-teal-400 transition-colors">파티편성</a>
          <a href="/dmg-simulate" class="hover:text-teal-400 transition-colors">딜 시뮬레이션</a>
          <a href="/posts" class="hover:text-teal-400 transition-colors">기타공략</a>
          <a href="/issues" class="hover:text-teal-400 transition-colors">방명록</a>
        </nav>

        <!-- Search & Login (Desktop) -->
        <div class="hidden md:flex items-center gap-2">
          <button class="flex items-center gap-2 text-sm text-zinc-500 hover:text-zinc-300 transition-colors border border-zinc-800 rounded-lg px-3 py-1.5 hover:border-zinc-600">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>검색</span>
            <kbd class="text-xs border border-zinc-700 rounded px-1 py-0.5 text-zinc-600">Ctrl+K</kbd>
          </button>
          <a href="/login" class="text-sm font-medium text-zinc-400 hover:text-zinc-100 transition-colors px-3 py-1.5">
            로그인
          </a>
        </div>

        <!-- Mobile Menu -->
        <div class="flex md:hidden items-center gap-2">
          <button class="p-2 text-zinc-400 hover:text-zinc-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
          <button class="flex flex-col gap-1.5 p-2 text-zinc-400 hover:text-zinc-100">
            <span class="block w-5 h-0.5 bg-current"></span>
            <span class="block w-5 h-0.5 bg-current"></span>
            <span class="block w-5 h-0.5 bg-current"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
      <div class="space-y-8">
        
        <!-- Title Section -->
        <div class="space-y-2">
          <h1 class="text-3xl font-bold text-zinc-100">
            캐릭터 데미지 시뮬레이션
          </h1>
          <p class="text-zinc-500">
            캐릭터의 육성 정도와 사이클에 따른 데미지 예상치를 보여줍니다.
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-2">
          <button disabled class="text-xs border px-3 py-1 rounded-md transition-colors disabled:opacity-30 disabled:cursor-not-allowed text-zinc-500 hover:text-teal-400 border-zinc-700 hover:border-teal-500/50 disabled:hover:text-zinc-500 disabled:hover:border-zinc-700">
            링크 복사
          </button>
          <button class="text-xs text-zinc-500 hover:text-zinc-300 border border-zinc-700 hover:border-zinc-500 px-3 py-1 rounded-md transition-colors">
            초기화
          </button>
        </div>

        <!-- Character Selection Grid -->
        <div class="grid grid-cols-3 gap-3 md:gap-5">
          <!-- Character 1 -->
          <button class="relative aspect-[3/4] rounded-xl border-2 border-dashed border-zinc-700 bg-zinc-900/40 hover:border-teal-500/40 hover:bg-zinc-900/70 overflow-hidden transition-all group">
            <div class="absolute inset-0 flex items-center justify-center text-zinc-600 group-hover:text-teal-400 transition-colors">
              <div class="text-center">
                <div class="text-3xl mb-1">＋</div>
                <div class="text-xs">1번 캐릭터</div>
              </div>
            </div>
          </button>

          <!-- Character 2 -->
          <button class="relative aspect-[3/4] rounded-xl border-2 border-dashed border-zinc-700 bg-zinc-900/40 hover:border-teal-500/40 hover:bg-zinc-900/70 overflow-hidden transition-all group">
            <div class="absolute inset-0 flex items-center justify-center text-zinc-600 group-hover:text-teal-400 transition-colors">
              <div class="text-center">
                <div class="text-3xl mb-1">＋</div>
                <div class="text-xs">2번 캐릭터</div>
              </div>
            </div>
          </button>

          <!-- Character 3 -->
          <button class="relative aspect-[3/4] rounded-xl border-2 border-dashed border-zinc-700 bg-zinc-900/40 hover:border-teal-500/40 hover:bg-zinc-900/70 overflow-hidden transition-all group">
            <div class="absolute inset-0 flex items-center justify-center text-zinc-600 group-hover:text-teal-400 transition-colors">
              <div class="text-center">
                <div class="text-3xl mb-1">＋</div>
                <div class="text-xs">3번 캐릭터</div>
              </div>
            </div>
          </button>
        </div>
      </div>
    </main>

  </body>
</html>
